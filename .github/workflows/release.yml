name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_ci_gate:
        description: publish without waiting for CI to finish on this commit
        type: boolean
        default: false

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  # This used to be a private copy of CI's verify list, which meant a release could
  # conclude green while the same commit's e2e was still running - and on 19 Aug one
  # did, against an e2e that went on to hang for six hours. Publication now waits for
  # the whole CI run on this exact commit, e2e and docs included.
  await-ci:
    if: ${{ github.ref == 'refs/heads/main' && inputs.skip_ci_gate != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Wait for CI to conclude on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          deadline=$(( SECONDS + 45 * 60 ))

          while true; do
            if runs=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=20"); then
              run=$(printf '%s' "${runs}" | jq -c '.workflow_runs | sort_by(.created_at) | last // empty')
              if [ -n "${run}" ]; then
                status=$(printf '%s' "${run}" | jq -r '.status')
                conclusion=$(printf '%s' "${run}" | jq -r '.conclusion // "none"')
                url=$(printf '%s' "${run}" | jq -r '.html_url')
                if [ "${status}" = completed ]; then
                  echo "CI concluded ${conclusion}: ${url}"
                  if [ "${conclusion}" != success ]; then
                    exit 1
                  fi
                  exit 0
                fi
                echo "CI is ${status}: ${url}"
              else
                echo "no CI run recorded for ${SHA} yet"
              fi
            else
              echo "the run list could not be read; retrying"
            fi

            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "CI did not conclude for ${SHA} inside the wait window"
              exit 1
            fi

            sleep 20
          done

  release:
    needs: await-ci
    # `success()` is implicit and would drop this job whenever the gate is skipped,
    # which is exactly what the manual override asks for. Name both outcomes instead.
    # The ref check is what keeps the dispatch button from publishing a side branch.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.await-ci.result == 'success' || needs.await-ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned to commit SHAs: this job holds the npm token, and a moving major tag
      # is a promise from whoever can retag it. Dependabot advances the pins weekly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          publish: pnpm release
          version: pnpm changeset version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
