name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push to main supersedes nothing: every commit that lands deserves a complete
# answer, and e2e is the only job slow enough to ever be the one cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One version failing is a fact about that version; the others still have to
      # report, or the matrix answers a narrower question than it was asked.
      fail-fast: false
      matrix:
        # The three release lines `engines.node` admits, floor included. Quoted because
        # YAML reads a bare 20.19 as a float, and the day the floor moves to something
        # like 20.10 the float would hand setup-node "20.1".
        node: ['20.19', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm coverage
      - run: pnpm ssr
      - run: pnpm size

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Resolve playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install browser system dependencies
        timeout-minutes: 10
        run: pnpm exec playwright install-deps chromium webkit firefox
      - name: Download browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: pnpm exec playwright install chromium webkit firefox
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && failure() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 7

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:docs
